<script>
  (function () {
    var totalCitationElement = document.getElementById('total_cit');
    var hIndexElement = document.getElementById('h_index');
    var publicationElements = document.getElementsByClassName('show_paper_citations');

    if (!totalCitationElement && !hIndexElement && publicationElements.length === 0) return;

    var repository = '{{ site.repository }}';
    var cdnUrl = 'https://cdn.jsdelivr.net/gh/' + repository + '@google-scholar-stats/gs_data.json';
    var githubUrl = 'https://raw.githubusercontent.com/' + repository + '/google-scholar-stats/gs_data.json';
    var localUrl = "{{ '/assets/data/gs_data.json' | relative_url }}";
    var urls = {% if site.google_scholar_stats_use_cdn %}[cdnUrl, githubUrl, localUrl]{% else %}[githubUrl, cdnUrl, localUrl]{% endif %};
    var dailyCacheKey = new Date().toISOString().slice(0, 10);

    function render(data) {
      if (totalCitationElement && data.citedby !== undefined) {
        totalCitationElement.textContent = data.citedby;
      }
      if (hIndexElement && data.hindex !== undefined) {
        hIndexElement.textContent = data.hindex;
      }

      Array.prototype.forEach.call(publicationElements, function (element) {
        var paperId = element.getAttribute('data');
        var publication = data.publications && data.publications[paperId];
        if (publication && publication.num_citations !== undefined) {
          element.textContent = ' · Citations: ' + publication.num_citations;
          element.setAttribute('title', 'Citation count from Google Scholar');
        }
      });
    }

    function fetchFrom(index) {
      if (index >= urls.length) {
        console.warn('Google Scholar citation data is temporarily unavailable.');
        return;
      }

      fetch(urls[index] + '?v=' + dailyCacheKey, { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(render)
        .catch(function () { fetchFrom(index + 1); });
    }

    fetchFrom(0);
  })();
</script>
