name: Sync Google Scholar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: w3k5SB8AAAAJ
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

      - name: Publish citation data
        shell: bash
        run: |
          stats_dir="$RUNNER_TEMP/google-scholar-stats"
          mkdir -p "$stats_dir"
          cp google_scholar_crawler/results/*.json "$stats_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan google-scholar-stats
          git rm -rf .
          cp "$stats_dir"/*.json .
          git add *.json
          git commit -m "Update Google Scholar citation data"
          git push origin HEAD:google-scholar-stats --force
